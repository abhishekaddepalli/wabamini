services:
  mysql:
    image: mysql:8.0
    container_name: whatsomni_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: whatsomni
      MYSQL_DATABASE: whatsomni
      MYSQL_USER: whatsomni
      MYSQL_PASSWORD: whatsomni
    ports:
      - "3306:3306"
    volumes:
      - whatsomni_mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "whatsomni", "-pwhatsomni"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - whatsomni_net

  redis:
    image: redis:7-alpine
    container_name: whatsomni_redis
    restart: unless-stopped
    networks:
      - whatsomni_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsomni_backend
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8088
      FRONTEND_URL: http://localhost:8088,http://frontend:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:8088,frontend:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: whatsomni
      DB_USERNAME: whatsomni
      DB_PASSWORD: whatsomni
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      RUN_MIGRATIONS: "true"
      BAILEYS_WORKER_URL: http://baileys:5001
      BAILEYS_SECRET_TOKEN: whatsomni_baileys_secret_key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - whatsomni_storage:/var/www/html/storage
    networks:
      - whatsomni_net

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsomni_queue
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: whatsomni
      DB_USERNAME: whatsomni
      DB_PASSWORD: whatsomni
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
    volumes:
      - whatsomni_storage:/var/www/html/storage
    networks:
      - whatsomni_net

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsomni_reverb
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: reverb
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: whatsomni
      DB_USERNAME: whatsomni
      DB_PASSWORD: whatsomni
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
    networks:
      - whatsomni_net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsomni_scheduler
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: whatsomni
      DB_USERNAME: whatsomni
      DB_PASSWORD: whatsomni
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
    volumes:
      - whatsomni_storage:/var/www/html/storage
    networks:
      - whatsomni_net

  baileys:
    build:
      context: ./baileys-worker
      dockerfile: Dockerfile
    container_name: whatsomni_baileys
    restart: unless-stopped
    environment:
      PORT: 5001
      LARAVEL_API_URL: http://nginx:80
      BAILEYS_SECRET_TOKEN: whatsomni_baileys_secret_key
    ports:
      - "5001:5001"
    volumes:
      - whatsomni_baileys_storage:/app/storage
    networks:
      - whatsomni_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8088
        NEXT_PUBLIC_REVERB_APP_KEY: whatsomni_reverb_key
        NEXT_PUBLIC_REVERB_HOST: localhost
        NEXT_PUBLIC_REVERB_PORT: 8088
        NEXT_PUBLIC_REVERB_SCHEME: http
    container_name: whatsomni_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - whatsomni_net

  nginx:
    image: nginx:alpine
    container_name: whatsomni_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - backend
      - frontend
      - reverb
    networks:
      - whatsomni_net

volumes:
  whatsomni_mysql_data:
  whatsomni_storage:
  whatsomni_baileys_storage:

networks:
  whatsomni_net:
    driver: bridge
