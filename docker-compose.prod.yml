services:
  mysql:
    image: mysql:8.0
    container_name: wabamini_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wabamini_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-whatsomni}
      MYSQL_USER: ${DB_USERNAME:-whatsomni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wabamini_db_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-whatsomni}", "-p${DB_PASSWORD:-wabamini_db_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wabamini_network

  redis:
    image: redis:7-alpine
    container_name: wabamini_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-wabamini_redis_secret}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-wabamini_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wabamini_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabamini_backend
    restart: always
    environment:
      CONTAINER_ROLE: app
      APP_NAME: "${APP_NAME:-WabaMini}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${API_URL:-https://api.yourdomain.com}"
      FRONTEND_URL: "${APP_URL:-https://app.yourdomain.com}"
      SANCTUM_STATEFUL_DOMAINS: "${DOMAIN:-yourdomain.com},app.${DOMAIN:-yourdomain.com},api.${DOMAIN:-yourdomain.com}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-whatsomni}
      DB_USERNAME: ${DB_USERNAME:-whatsomni}
      DB_PASSWORD: ${DB_PASSWORD:-wabamini_db_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-wabamini_redis_secret}"
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      RUN_MIGRATIONS: "true"
      BAILEYS_WORKER_URL: http://baileys:5001
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:-wabamini_internal_secret}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - wabamini_network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabamini_queue
    restart: always
    environment:
      CONTAINER_ROLE: queue
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-whatsomni}
      DB_USERNAME: ${DB_USERNAME:-whatsomni}
      DB_PASSWORD: ${DB_PASSWORD:-wabamini_db_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-wabamini_redis_secret}"
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - wabamini_network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabamini_reverb
    restart: always
    environment:
      CONTAINER_ROLE: reverb
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      REVERB_APP_ID: "${REVERB_APP_ID:-wabamini_app_id}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-wabamini_reverb_key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-wabamini_app_secret}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-whatsomni}
      DB_USERNAME: ${DB_USERNAME:-whatsomni}
      DB_PASSWORD: ${DB_PASSWORD:-wabamini_db_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-wabamini_redis_secret}"
    depends_on:
      - backend
    networks:
      - wabamini_network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabamini_scheduler
    restart: always
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-whatsomni}
      DB_USERNAME: ${DB_USERNAME:-whatsomni}
      DB_PASSWORD: ${DB_PASSWORD:-wabamini_db_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-wabamini_redis_secret}"
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - wabamini_network

  baileys:
    build:
      context: ./baileys-worker
      dockerfile: Dockerfile
    container_name: wabamini_baileys
    restart: always
    environment:
      PORT: 5001
      LARAVEL_API_URL: http://backend:9000
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:-wabamini_internal_secret}"
    volumes:
      - baileys_storage:/app/storage
    networks:
      - wabamini_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "${API_URL:-https://api.yourdomain.com}"
        NEXT_PUBLIC_REVERB_APP_KEY: "${REVERB_APP_KEY:-wabamini_reverb_key}"
        NEXT_PUBLIC_REVERB_HOST: "${DOMAIN:-yourdomain.com}"
        NEXT_PUBLIC_REVERB_PORT: 443
        NEXT_PUBLIC_REVERB_SCHEME: https
    container_name: wabamini_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - wabamini_network

  nginx:
    image: nginx:alpine
    container_name: wabamini_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/public:/var/www/html/public:ro
      - backend_storage:/var/www/html/storage:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - reverb
    networks:
      - wabamini_network

volumes:
  mysql_data:
  redis_data:
  backend_storage:
  baileys_storage:
  certbot_etc:
  certbot_var:

networks:
  wabamini_network:
    driver: bridge
