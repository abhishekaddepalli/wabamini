# ==============================================================================
# WabaMini - Nginx Configuration (Single Domain - Recommended)
# Domain: yourdomain.com
# Unified frontend (Next.js), backend API (Laravel), and WebSockets (Reverb)
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum file upload size (WhatsApp media, CSV imports, avatars)
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Access and Error Logs
    access_log /var/log/nginx/wabamini_access.log;
    error_log /var/log/nginx/wabamini_error.log warn;

    # --------------------------------------------------------------------------
    # 1. Laravel Storage Media Assets (Public user uploads & attachments)
    # --------------------------------------------------------------------------
    location ^~ /storage/ {
        alias /www/apps/wabamini/backend/storage/app/public/;
        access_log off;
        log_not_found off;
        expires max;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. Laravel Reverb Realtime WebSockets
    # --------------------------------------------------------------------------
    location ^~ /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. Laravel Backend (API, Sanctum CSRF, Broadcasting auth, Health endpoints)
    # --------------------------------------------------------------------------
    location ~ ^/(api|sanctum|broadcasting|up) {
        root /www/apps/wabamini/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /www/apps/wabamini/backend/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_ROOT /www/apps/wabamini/backend/public;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param X-Forwarded-Proto $scheme;
            fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 180s;
        }
    }

    # --------------------------------------------------------------------------
    # 4. Next.js Static Optimization Assets
    # --------------------------------------------------------------------------
    location /_next/static/ {
        alias /www/apps/wabamini/frontend/.next/static/;
        access_log off;
        log_not_found off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 5. Next.js Frontend Server (Reverse Proxy to Node service on port 3100)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Deny access to hidden files (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
